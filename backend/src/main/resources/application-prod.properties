# ---- Docker / production: MySQL + Redis. Secrets come from environment variables ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# CACHE_TYPE=redis uses Redis; anything else keeps the cache in memory
spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=${REDIS_HEALTH:false}

app.jwt.secret=${JWT_SECRET}
app.seed-demo-data=${SEED_DEMO_DATA:false}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
