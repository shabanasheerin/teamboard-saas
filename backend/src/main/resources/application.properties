spring.application.name=teamboard
server.port=${PORT:8081}

# No profile given = "local" (MySQL on localhost:3306).
# Docker / production use SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.data.redis.repositories.enabled=false

# Access token: 15 minutes. Refresh token: 7 days.
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-days=7

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.registration-enabled=${REGISTRATION_ENABLED:true}
app.seed-demo-data=false

# Overdue reminder job: every day at 9:00 AM
app.reminders.cron=0 0 9 * * *

# Email alerts (optional). Needs SPRING_MAIL_HOST etc. when enabled.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@teamboard.local}

# Cache entries live 5 minutes when Redis is used
spring.cache.redis.time-to-live=300000

management.endpoints.web.exposure.include=health
