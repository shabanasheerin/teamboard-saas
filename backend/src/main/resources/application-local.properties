# ---- Local development: your own MySQL on localhost:3306 ----
# The database "teamboard" is created automatically. Change the password here or with DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/teamboard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# In-memory cache instead of Redis
spring.cache.type=simple
management.health.redis.enabled=false

app.jwt.secret=${JWT_SECRET:local-dev-only-secret-local-dev-only-secret-12345}
app.seed-demo-data=false
